name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Pin OSXCross so the toolchain cache key is stable and builds are reproducible.
  OSXCROSS_REF: e6ab3fa7423f9235ce9ed6381d6d3af191b46b59

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cmd/watch/web/package-lock.json

      - name: Install and build frontend
        run: |
          cd cmd/watch/web
          npm ci
          npm run build

      # Cache the apt packages so they restore instead of re-downloading each run.
      # Cross-compilers for the Windows and Linux-arm64 targets.
      - name: Install cross-compilation toolchains
        uses: awalsh128/cache-apt-pkgs-action@2c09a5e66da6c8016428a2172bd76e5e4f14bb17 # v1
        with:
          packages: gcc-mingw-w64-x86-64 gcc-aarch64-linux-gnu
          version: 1.0

      # Build tools + the runtime libs the OSXCross clang links against. Installed
      # unconditionally (restored from cache) since they are needed on a cache hit
      # to use the toolchain and on a miss to build it.
      - name: Install OSXCross dependencies
        uses: awalsh128/cache-apt-pkgs-action@2c09a5e66da6c8016428a2172bd76e5e4f14bb17 # v1
        with:
          packages: clang llvm-dev libxml2-dev uuid-dev libssl-dev bash patch make tar xz-utils bzip2 gzip sed cpio libbz2-dev
          version: 1.0

      # The built toolchain (clang wrappers + cctools/ld64 + the extracted SDK)
      # is identical run-to-run, so cache it on the pinned OSXCross ref + SDK.
      - name: Cache OSXCross toolchain
        id: osxcross
        uses: actions/cache@v4
        with:
          path: /tmp/osxcross/target
          key: osxcross-${{ env.OSXCROSS_REF }}-sdk12.3-${{ runner.os }}

      # Only the slow part (building OSXCross from source) is skipped on a hit.
      - name: Build OSXCross
        if: steps.osxcross.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/tpoechtrager/osxcross /tmp/osxcross
          cd /tmp/osxcross
          git checkout "${OSXCROSS_REF}"
          wget -nc https://github.com/joseluisq/macosx-sdks/releases/download/12.3/MacOSX12.3.sdk.tar.xz -O tarballs/MacOSX12.3.sdk.tar.xz
          UNATTENDED=yes OSX_VERSION_MIN=10.13 ./build.sh

      - name: Add OSXCross to PATH
        run: echo "/tmp/osxcross/target/bin" >> $GITHUB_PATH

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish npm Package
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify Node and npm versions
        run: |
          node --version
          npm --version

      - name: Set package version from tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          npm version "$VERSION" --no-git-tag-version

      - name: Publish to npm
        run: npm publish --access public --provenance

  update-homebrew:
    name: Update Homebrew Tap
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download checksums
        run: |
          VERSION=${{ steps.version.outputs.version }}
          curl -sL "https://github.com/LegacyCodeHQ/clarity-cli/releases/download/v${VERSION}/clarity_${VERSION}_checksums.txt" -o checksums.txt

      - name: Parse checksums
        id: checksums
        run: |
          VERSION=${{ steps.version.outputs.version }}
          echo "darwin_amd64=$(grep "clarity_${VERSION}_darwin_amd64.tar.gz" checksums.txt | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "darwin_arm64=$(grep "clarity_${VERSION}_darwin_arm64.tar.gz" checksums.txt | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "linux_amd64=$(grep "clarity_${VERSION}_linux_amd64.tar.gz" checksums.txt | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "linux_arm64=$(grep "clarity_${VERSION}_linux_arm64.tar.gz" checksums.txt | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Update Homebrew formula
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.version }}

          # Clone homebrew tap
          git clone https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/LegacyCodeHQ/homebrew-tap.git
          cd homebrew-tap

          # Create Formula directory if it doesn't exist
          mkdir -p Formula

          # Generate formula
          cat > Formula/clarity.rb <<EOF
          class Clarity < Formula
            desc "CLI tool for analyzing and visualizing dependency graphs"
            homepage "https://github.com/LegacyCodeHQ/clarity-cli"
            version "${VERSION}"
            license "AGPL-3.0-only"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/LegacyCodeHQ/clarity-cli/releases/download/v${VERSION}/clarity_${VERSION}_darwin_arm64.tar.gz"
                sha256 "${{ steps.checksums.outputs.darwin_arm64 }}"
              else
                url "https://github.com/LegacyCodeHQ/clarity-cli/releases/download/v${VERSION}/clarity_${VERSION}_darwin_amd64.tar.gz"
                sha256 "${{ steps.checksums.outputs.darwin_amd64 }}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/LegacyCodeHQ/clarity-cli/releases/download/v${VERSION}/clarity_${VERSION}_linux_arm64.tar.gz"
                sha256 "${{ steps.checksums.outputs.linux_arm64 }}"
              else
                url "https://github.com/LegacyCodeHQ/clarity-cli/releases/download/v${VERSION}/clarity_${VERSION}_linux_amd64.tar.gz"
                sha256 "${{ steps.checksums.outputs.linux_amd64 }}"
              end
            end

            def install
              bin.install "clarity"
            end

            test do
              system "#{bin}/clarity", "--version"
            end
          end
          EOF

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/clarity.rb
          git commit -m "Update clarity to v${VERSION}"
          git push origin trunk
